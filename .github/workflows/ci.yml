name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint (Ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run Ruff
        run: ruff check .

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run pytest
        run: pytest --junitxml=pytest-results.xml
      - name: Upload pytest report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results-python-${{ matrix.python-version }}
          path: pytest-results.xml
          if-no-files-found: warn
          retention-days: 7

  ci-ok:
    name: CI OK
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: always()
    steps:
      - name: Fail if a required job failed or was cancelled
        if: needs.lint.result != 'success' || needs.test.result != 'success'
        run: |
          echo "Lint or one of the test matrix jobs did not succeed."
          exit 1
      - name: Confirm all checks passed
        if: needs.lint.result == 'success' && needs.test.result == 'success'
        run: echo "Lint and all Python test versions passed."